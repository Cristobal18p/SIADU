openapi: 3.0.3
info:
  title: SIADU — API Oficial Completa
  description: |
    Especificación unificada OpenAPI 3.0 para el Sistema Integral de Automatización de Documentos Universitarios (SIADU).
    Universidad de Panamá — Facultad de Informática, Electrónica y Comunicación (FIEC).
    Todos los datos en peticiones y respuestas utilizan estrictamente la convención **`camelCase`**.

    Este archivo se **genera** a partir de los módulos de `docs/api` (`auth`, `catalogs`, `templates`, `requests`,
    `approvals`, `documents`) y de `common.yaml`. Los cambios se hacen en los módulos, nunca aquí.

    **Límites:** cualquier endpoint puede responder `429` `DEMASIADAS_SOLICITUDES` (300 peticiones por minuto por
    usuario); el login y el PDF tienen límites propios (ver cada operación).
  version: 2.12.0
servers:
  - url: http://localhost:7001
    description: Servidor de desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Autenticación con JWT (cédula / @up.ac.pa) y perfil de usuario
  - name: Catalogs
    description: Catálogos de cargos, autoridades y áreas institucionales
  - name: Flows
    description: Flujos secuenciales de aprobación reutilizables por unidad
  - name: Templates
    description: Inventario administrativo paginado, constructor TipTap y catálogo de trámites
  - name: Requests
    description: Envío de solicitudes, historial del solicitante y línea de tiempo
  - name: Approvals
    description: Bandeja de entrada de autoridades y resoluciones (Aprobado / Rechazado)
  - name: Documents
    description: Generación de PDF oficial a 300 DPI (Puppeteer). La vista previa se arma en el cliente
paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Iniciar sesión institucional
      description: |
        Valida las credenciales institucionales contra la base de datos (con hash `bcrypt`).
        Actualiza de forma auditada el campo `ultimo_acceso` en la tabla `usuarios`.
        `debeCambiarPassword` se lee de `usuarios.clave_inicial`.

        **Cuenta y perfil activos:** el acceso exige `usuarios.estado = A` y que el usuario pertenezca al `estamento`
        elegido con su perfil activo (la persona y su registro de estudiante, profesor o administrativo con estado `A`).
        Una cuenta sin perfil en ese estamento, o con la persona inactiva, recibe `401` `CREDENCIALES_INVALIDAS`.
        Si `usuario.debeCambiarPassword` es `true`, el cliente muestra la pantalla de cambio de contraseña antes
        de cualquier otra.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identificador
                - password
                - estamento
              properties:
                identificador:
                  type: string
                  description: Cédula personal o correo institucional
                  example: 9-000-0001
                password:
                  type: string
                  format: password
                  description: Contraseña del usuario
                  example: Demo2026*
                estamento:
                  description: Estamento institucional seleccionado en el selector de acceso
                  allOf:
                    - $ref: '#/components/schemas/Estamento'
                  example: ESTUDIANTE
      responses:
        '200':
          description: Autenticación exitosa. Retorna token JWT y perfil básico.
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - usuario
                properties:
                  token:
                    type: string
                    description: |
                      JWT HS256 firmado con `JWT_SECRET`. Su vida es configurable con la variable `EXPIRESIN`
                      (nunca menos de 2 horas); si no se define, dura 8 horas. No hay renovación: al vencer,
                      cualquier endpoint responde `401` y el cliente cierra la sesión.
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  usuario:
                    type: object
                    required:
                      - idUsuario
                      - correo
                      - cedula
                      - nombreCompleto
                      - roles
                      - estamentos
                      - debeCambiarPassword
                    properties:
                      idUsuario:
                        type: integer
                        example: 1
                      correo:
                        type: string
                        format: email
                        example: alex.demo@up.ac.pa
                      cedula:
                        type: string
                        description: Cédula del usuario (obligatoria)
                        example: 9-000-0001
                      nombreCompleto:
                        type: string
                        example: Alex Demo
                      roles:
                        type: array
                        description: Privilegios de sistema para navegación y guardas de rutas
                        items:
                          $ref: '#/components/schemas/RolSistema'
                        example:
                          - SOLICITANTE
                      estamentos:
                        type: array
                        description: Estamentos a los que pertenece el usuario
                        items:
                          $ref: '#/components/schemas/Estamento'
                        example:
                          - ESTUDIANTE
                      codUnidad:
                        type: integer
                        description: Código de la unidad académica a la que pertenece el usuario
                        example: 24
                      debeCambiarPassword:
                        type: boolean
                        description: '`true` mientras la cuenta tenga la contraseña inicial: debe cambiarla antes de usar el sistema'
                        example: false
        '400':
          $ref: '#/components/responses/ValidacionFallida'
        '401':
          description: Credenciales no válidas o acceso no autorizado para el portal seleccionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: CREDENCIALES_INVALIDAS
                  mensaje: Credenciales de acceso incorrectas o cuenta no autorizada.
        '429':
          description: |
            Demasiados intentos fallidos. Tras 8 intentos fallidos de la misma cuenta desde la misma IP (o 100 desde
            una IP) en 15 minutos, el servidor rechaza los siguientes. La respuesta trae `Retry-After` (segundos).
          headers:
            Retry-After:
              description: Segundos que debe esperar el cliente antes de volver a intentar
              schema:
                type: integer
                example: 600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: DEMASIADOS_INTENTOS
                  mensaje: Demasiados intentos fallidos. Espere unos minutos e intente de nuevo.
  /api/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Cerrar sesión
      description: |
        Cierra **todas** las sesiones del usuario: el servidor incrementa su `version_sesion` y cualquier token
        emitido antes (en este u otro dispositivo) responde `401` `NO_AUTENTICADO` desde ese momento. El cliente
        siempre descarta el token localmente.

        **Cómo se revoca:** el token lleva el claim `vs` (versión de sesión). En cada petición el servidor lo
        compara con `usuarios.version_sesion`; si no coincide, el token ya no vale. Un token sin `vs` cuenta como 0.
      x-roles:
        - SOLICITANTE
        - APROBADOR
        - ADMINISTRADOR
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - mensaje
                properties:
                  ok:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: Sesión finalizada exitosamente.
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /api/auth/password:
    post:
      tags:
        - Auth
      operationId: changePassword
      summary: Cambiar la contraseña del usuario en sesión
      description: |
        Cambia la contraseña del usuario autenticado. Es obligatorio en el primer acceso
        (`debeCambiarPassword: true`) y al terminar el indicador queda en `false`.

        **Política de la contraseña nueva:** de 8 a 64 caracteres, con al menos una mayúscula, una minúscula,
        un número y un símbolo, y distinta de la actual. Se guarda con hash `bcrypt`.

        Errores de validación (`400`):
        - `PASSWORD_ACTUAL_INCORRECTA`: la contraseña actual no coincide (`detalles[].campo = passwordActual`).
          No se usa `401` para no cerrar la sesión del cliente.
        - `VALIDACION_FALLIDA`: la nueva no cumple la política (`detalles[].campo = passwordNueva`).
      x-roles:
        - SOLICITANTE
        - APROBADOR
        - ADMINISTRADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - passwordActual
                - passwordNueva
              properties:
                passwordActual:
                  type: string
                  format: password
                  description: Contraseña vigente (la inicial, en el primer acceso)
                  example: Demo2026*
                passwordNueva:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 64
                  example: Fiec#2026seguro
      responses:
        '200':
          description: |
            Contraseña cambiada; `debeCambiarPassword` queda en `false`. Las demás sesiones del usuario quedan
            revocadas y la respuesta trae un `token` nuevo para esta: el cliente debe guardarlo en lugar del anterior.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - mensaje
                  - token
                properties:
                  ok:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: Contraseña actualizada correctamente.
                  token:
                    type: string
                    description: JWT nuevo de esta sesión
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: La contraseña actual no coincide o la nueva no cumple la política
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: PASSWORD_ACTUAL_INCORRECTA
                  mensaje: La contraseña actual no es correcta.
                  detalles:
                    - campo: passwordActual
                      mensaje: La contraseña actual no es correcta.
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /api/auth/me:
    get:
      tags:
        - Auth
      operationId: getMe
      summary: Obtener perfil completo del usuario autenticado
      description: |
        Devuelve el contexto completo del usuario: datos de contacto, unidad académica,
        carrera (estudiante) y cargos vigentes (administrativo/autoridad). Los profesores se identifican por su unidad:
        la base no registra departamentos de profesores.
        Todo usuario activo incluye el rol `SOLICITANTE` en `roles`, además de `APROBADOR` o `ADMINISTRADOR` si los tiene.
      x-roles:
        - SOLICITANTE
        - APROBADOR
        - ADMINISTRADOR
      responses:
        '200':
          description: Perfil detallado del usuario en sesión
          content:
            application/json:
              schema:
                type: object
                required:
                  - idUsuario
                  - correo
                  - cedula
                  - nombreCompleto
                  - nombre
                  - apellido
                  - ultimoAcceso
                  - roles
                  - estamentos
                  - unidad
                  - debeCambiarPassword
                properties:
                  idUsuario:
                    type: integer
                    example: 1
                  correo:
                    type: string
                    format: email
                    example: alex.demo@up.ac.pa
                  cedula:
                    type: string
                    description: Cédula del usuario (obligatoria)
                    example: 9-000-0001
                  nombre:
                    type: string
                    example: Alex
                  apellido:
                    type: string
                    example: Demo
                  nombreCompleto:
                    type: string
                    description: Nombre y apellido tal como se muestran en la interfaz
                    example: Alex Demo
                  ultimoAcceso:
                    type: string
                    format: date-time
                    nullable: true
                    description: |
                      Fecha del inicio de sesión anterior al actual; `null` en el primer acceso.
                      El campo siempre está presente. Su valor no cambia mientras dure la sesión
                      (hasta el siguiente login), aunque `/auth/me` se consulte varias veces.
                    example: '2026-10-05T16:30:00Z'
                  debeCambiarPassword:
                    type: boolean
                    description: |
                      `true` mientras la cuenta tenga la contraseña inicial. El cliente muestra la pantalla de cambio
                      de contraseña y no deja usar el resto del sistema hasta cambiarla (`POST /api/auth/password`).
                    example: false
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/RolSistema'
                    example:
                      - SOLICITANTE
                  estamentos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Estamento'
                    example:
                      - ESTUDIANTE
                  unidad:
                    description: Unidad académica a la que pertenece el usuario (estudiante, profesor o administrativo); siempre presente
                    allOf:
                      - $ref: '#/components/schemas/UnidadResumen'
                  carrera:
                    type: object
                    nullable: true
                    description: Presente para estudiantes; `null` en los demás
                    allOf:
                      - $ref: '#/components/schemas/CarreraResumen'
                  cargos:
                    type: array
                    description: |
                      Cargos y asignaciones administrativas vigentes del usuario, del cargo mayor al menor. En cada uno, `titularActual` es el propio
                      usuario, `idUsuarioTitular` su `idUsuario` y `esAprobador` indica si tiene el rol `APROBADOR`.
                    items:
                      $ref: '#/components/schemas/CargoResumen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /api/catalogs/cargos:
    get:
      tags:
        - Catalogs
      operationId: listCargos
      summary: Obtener cargos vigentes con sus titulares actuales
      description: |
        Retorna la lista de cargos y autoridades asignadas en la unidad para configurar flujos o mostrar firmas.
        Con `soloAprobadores=true` devuelve únicamente los cargos cuyo titular puede ser aprobador
        (`esAprobador: true`); el constructor de flujos siempre lo envía así.

        Solo incluye los cargos de autoridad de la unidad: Decano/a, Vicedecano/a, Director/a de Escuela, Director/a de
        Departamento, la Secretaría Administrativa y las secretarias de cada director. Las que tienen escuela
        (`escuela` distinto de `null`) permiten un paso `ESCUELA_SOLICITANTE` del flujo, que resuelve al titular según
        la carrera del solicitante.
      x-roles:
        - SOLICITANTE
        - APROBADOR
        - ADMINISTRADOR
      parameters:
        - in: query
          name: codUnidad
          required: false
          schema:
            type: integer
            example: 24
          description: Código de la unidad académica. Solo se admite la unidad del usuario (si se omite, se deduce del token JWT); otra unidad responde `403`
        - in: query
          name: soloAprobadores
          required: false
          schema:
            type: boolean
            default: false
          description: Si es `true`, solo cargos con titular con cuenta activa y rol `APROBADOR`
      responses:
        '200':
          description: Lista de cargos y titulares disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CargoResumen'
              example:
                - idAsignacion: 12
                  idCargo: 14
                  nombreCargo: Director/a de Escuela
                  titularActual: Dra. Lia Muestra
                  idUsuarioTitular: 31
                  area: Escuela de Ingeniería Informática
                  escuela: Escuela de Ingeniería Informática
                  esAprobador: true
                - idAsignacion: 1
                  idCargo: 1
                  nombreCargo: Decano
                  titularActual: Dr. Julio Demo
                  idUsuarioTitular: null
                  area: Decanato
                  escuela: null
                  esAprobador: false
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CambioPasswordRequerido'
  /api/flows:
    get:
      tags:
        - Flows
      operationId: listFlows
      summary: Listar flujos de aprobación reutilizables de la unidad
      description: |
        Consulta los flujos `ACTIVO` de la unidad académica del administrador, los que se pueden reutilizar al
        armar una plantilla. Los flujos en `BORRADOR` no aparecen: pertenecen a una versión de plantilla en edición.
      x-roles:
        - ADMINISTRADOR
      parameters:
        - in: query
          name: codUnidad
          required: false
          schema:
            type: integer
            example: 24
          description: Código de la unidad académica; solo la del administrador (otra responde `403`)
      responses:
        '200':
          description: Lista de flujos de aprobación disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - idFlujo
                    - nombre
                    - codigo
                    - totalPasos
                    - pasosResumen
                  properties:
                    idFlujo:
                      type: integer
                      example: 1
                    nombre:
                      type: string
                      example: Aprobación Estándar FIEC (Escuela + Decanato)
                    codigo:
                      type: string
                      example: FLUJO-FIEC-ESC-DEC
                    totalPasos:
                      type: integer
                      example: 2
                    pasosResumen:
                      type: array
                      items:
                        type: string
                      description: Nombre del cargo de cada paso, en orden; un paso por escuela lleva el sufijo « (del solicitante)»
                      example:
                        - Director/a de Escuela (del solicitante)
                        - Decano/a
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags:
        - Flows
      operationId: createFlow
      summary: Crear un nuevo flujo de aprobación (en borrador)
      description: |
        Registra una cadena secuencial de firmas en estado `BORRADOR`. Pasa a `ACTIVO` y queda reutilizable cuando se
        publica la plantilla que lo usa. Para cambiar la estructura de un flujo `ACTIVO` se crea un flujo nuevo con
        este endpoint (el cliente puede partir de los pasos del existente).

        Los pasos llevan secuencias únicas y consecutivas desde 1. Un paso `FIJO` lleva `idAsignacion`, que debe ser
        una asignación vigente de la unidad (`400` si no). Un paso `ESCUELA_SOLICITANTE` lleva `idCargo` (un cargo con
        escuela, `CargoResumen.escuela`) y no `idAsignacion`: el titular se resuelve al radicar según la escuela de la
        carrera del solicitante (ver `PasoFlujo`). Las reglas de aprobador y de personas distintas de abajo se aplican
        a los pasos `FIJO`; en los de escuela se comprueban al publicar y al radicar, con el titular de cada escuela.
        Un paso mal formado responde `400` (`VALIDACION_FALLIDA`): `FIJO` sin `idAsignacion`, `ESCUELA_SOLICITANTE` sin
        `idCargo` o con un cargo que no tiene escuela (`detalles[].campo = pasos[i].idCargo`), un paso con ambos
        identificadores, o el mismo cargo por escuela repetido en el flujo. El `codigo` es único: `409` (`CONFLICTO_ESTADO`) si ya existe.

        **Solo aprobadores:** el titular de cada asignación debe tener cuenta activa y el rol `APROBADOR`
        (`CargoResumen.esAprobador`). Si no, `400` (`APROBADOR_INVALIDO`) con `detalles[].campo = pasos[i].idAsignacion`
        en el paso afectado.

        **Personas distintas (estricto):** cada persona aparece una sola vez en el flujo. No se puede repetir el
        `idAsignacion` ni el titular de la asignación (`idUsuarioTitular` de `CargoResumen`), aunque sean cargos
        distintos de la misma persona. Si se repite, `400` (`VALIDACION_FALLIDA`) con
        `detalles[].campo = pasos[i].idAsignacion` en el paso repetido. La regla se vuelve a comprobar al **publicar**
        una plantilla con el flujo (`409` si un cambio de titulares dejó a una persona en dos pasos).

        **Orden estricto:** las aprobaciones siguen el orden de `secuencia`. El paso siguiente se crea solo cuando
        el anterior aprueba; nadie resuelve un paso que no le corresponde ni antes de su turno, y un rechazo cierra
        la solicitud.
      x-roles:
        - ADMINISTRADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - codigo
                - codUnidad
                - pasos
              properties:
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 150
                  example: Aprobación Consejo de Facultad
                codigo:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Único. Alfanumérico con guiones
                  example: FLUJO-FIEC-CONSEJO
                descripcion:
                  type: string
                  example: Flujo que pasa por Escuela y Decanato
                codUnidad:
                  type: integer
                  description: Unidad del administrador; con otra responde `403`
                  example: 24
                pasos:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/PasoFlujo'
      responses:
        '201':
          description: Flujo creado en borrador
          content:
            application/json:
              schema:
                type: object
                required:
                  - idFlujo
                  - codigo
                  - estado
                  - totalPasos
                  - mensaje
                properties:
                  idFlujo:
                    type: integer
                    example: 2
                  codigo:
                    type: string
                    example: FLUJO-FIEC-CONSEJO
                  estado:
                    $ref: '#/components/schemas/EstadoFlujo'
                  totalPasos:
                    type: integer
                    example: 2
                  mensaje:
                    type: string
                    example: Flujo creado exitosamente.
        '400':
          $ref: '#/components/responses/ValidacionFallida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
  /api/flows/{id}:
    get:
      tags:
        - Flows
      operationId: getFlow
      summary: Detalle de un flujo de aprobación
      description: |
        Devuelve el estado y los pasos del flujo con su `idAsignacion`, cargo y titular. Permite reutilizar un flujo
        existente en el constructor y mostrar su cadena completa.
      x-roles:
        - ADMINISTRADOR
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Identificador del flujo
      responses:
        '200':
          description: Flujo con sus pasos ordenados por `secuencia`
          content:
            application/json:
              schema:
                type: object
                required:
                  - idFlujo
                  - nombre
                  - codigo
                  - estado
                  - codUnidad
                  - pasos
                properties:
                  idFlujo:
                    type: integer
                    example: 1
                  nombre:
                    type: string
                    example: Aprobación Estándar FIEC (Escuela + Decanato)
                  codigo:
                    type: string
                    example: FLUJO-FIEC-ESC-DEC
                  estado:
                    $ref: '#/components/schemas/EstadoFlujo'
                  descripcion:
                    type: string
                    nullable: true
                    example: Flujo que pasa por Escuela y Decanato
                  codUnidad:
                    type: integer
                    example: 24
                  pasos:
                    type: array
                    items:
                      $ref: '#/components/schemas/PasoFlujo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags:
        - Flows
      operationId: updateFlow
      summary: Editar un flujo en borrador
      description: |
        Reemplaza el nombre, la descripción y **todos** los pasos de un flujo en `BORRADOR`. El `codigo` y la
        `codUnidad` no se pueden cambiar. Aplican las mismas validaciones que al crear (secuencias consecutivas,
        asignaciones vigentes de la unidad, solo aprobadores, personas distintas).

        Un flujo `ACTIVO` no se edita: responde `409` (`CONFLICTO_ESTADO`) y hay que crear otro flujo.
      x-roles:
        - ADMINISTRADOR
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Identificador del flujo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - pasos
              properties:
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 150
