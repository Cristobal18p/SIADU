  /api/templates/{id}:
    get:
      tags:
        - Templates
      operationId: getTemplate
      summary: Cargar plantilla completa (Constructor o Formulario Web)
      description: |
        Obtiene la definición integral de la plantilla: diseño TipTap, variables dinámicas
        del formulario web y el flujo de firmas asociado.
        Si el usuario es un solicitante, solo puede consultar versiones publicadas (`ACTIVO`) de su unidad cuya
        `audiencia` incluya alguno de sus estamentos; cualquier otra versión le responde `404`, como si no existiera.
        Si es administrador, solo las plantillas de su unidad (otra responde `404`).
        Toda versión `ACTIVO` tiene flujo de aprobación porque no se puede publicar sin él: `flujo` solo
        es `null` en versiones en `BORRADOR`.
      x-roles:
        - ADMINISTRADOR
        - SOLICITANTE
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Identificador único de la plantilla
        - in: query
          name: idVersion
          required: false
          schema:
            type: integer
          description: |
            Versión específica a consultar. Si se omite, devuelve la versión `ACTIVO`; si no hay, la de mayor
            `numeroVersion` (la misma que lista el inventario).
      responses:
        '200':
          description: Plantilla completa con AST TipTap y variables
          content:
            application/json:
              schema:
                type: object
                required:
                  - idPlantilla
                  - nombre
                  - codUnidad
                  - audiencia
                  - idVersion
                  - numeroVersion
                  - estado
                  - variableFormJson
                  - disenoFormJson
                properties:
                  idPlantilla:
                    type: integer
                    example: 5
                  nombre:
