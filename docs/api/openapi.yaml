                      estado:
                        $ref: '#/components/schemas/EstadoFlujo'
                      pasos:
                        type: array
                        items:
                          $ref: '#/components/schemas/PasoFlujo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CambioPasswordRequerido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags:
        - Templates
      operationId: updateTemplate
      summary: Guardar cambios en versión en borrador
      description: |
        Actualiza el diseño TipTap, las variables y el flujo de una versión en estado `BORRADOR`.
        No permite modificar versiones que ya se encuentran en estado `ACTIVO` o `INACTIVO`.
        `codUnidad` se fija al crear la plantilla y no se puede cambiar.
        `audiencia` se puede cambiar solo mientras la plantilla **nunca se ha publicado** (su única versión es la 1, en
        `BORRADOR`): si se omite, se conserva. En una plantilla que ya tuvo una versión publicada la audiencia es la de
        sus solicitudes y versiones anteriores, y enviarla responde `409` (`CONFLICTO_ESTADO`).
        `idFlujo`: si se omite, la versión conserva su flujo actual; si se envía `null`, se lo quita.
        El flujo debe ser `ACTIVO` o un `BORRADOR` sin dueño (o ya propio de esta versión) de la misma unidad:
        `404` si no existe, `400` si es de otra unidad y `409` si es un borrador de otra versión.
        Se valida que cada variable usada en `cuerpoDocumento` esté definida en `variableFormJson`
        (y viceversa), que los `id` sean únicos, que un `select` tenga opciones y que `min` no sea mayor que `max`.
      x-roles:
        - ADMINISTRADOR
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Identificador de la plantilla
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idVersion
                - variableFormJson
                - disenoFormJson
              properties:
                idVersion:
                  type: integer
                  example: 12
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: Solicitud de Retiro de Asignatura (Revisada)
                descripcion:
                  type: string
                  nullable: true
                  example: Descripción actualizada
                audiencia:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Estamento'
                  description: Solo en una plantilla que nunca se ha publicado; si se omite, se conserva
                  example:
                    - ESTUDIANTE
                    - PROFESOR
                idFlujo:
                  type: integer
                  nullable: true
                  example: 1
                variableFormJson:
                  $ref: '#/components/schemas/VariableFormJson'
                disenoFormJson:
                  $ref: '#/components/schemas/DisenoFormJson'
      responses:
        '200':
          description: Versión borrador actualizada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  idPlantilla:
                    type: integer
                    example: 5
                  idVersion:
                    type: integer
                    example: 12
                  mensaje:
                    type: string
                    example: Cambios guardados en borrador con éxito.
        '400':
          $ref: '#/components/responses/ValidacionFallida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
    delete:
      tags:
