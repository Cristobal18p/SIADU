  /api/templates:
    get:
      tags:
        - Templates
      operationId: listTemplates
      summary: Inventario de plantillas para administradores (Paginado)
      description: |
        Lista todas las plantillas registradas en la unidad con sus estados (`ACTIVO`, `BORRADOR`, `INACTIVO`),
        ordenadas por `fechaActualizacion` de la más reciente a la más antigua.
        Incluye paginación eficiente para evitar transferencias excesivas de datos.
        Cada plantilla se lista una sola vez con su versión vigente (la `ACTIVO`; si no hay, la de mayor número).
        Para los indicadores por estado del panel de inicio use `GET /api/templates/summary`, que los devuelve en una
        sola llamada. (Consultar con `estado=ACTIVO|BORRADOR|INACTIVO` y `limit=1` y leer `total` da los mismos números.)
      x-roles:
        - ADMINISTRADOR
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Número de página actual
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          description: Cantidad de plantillas por página
        - in: query
          name: estado
          schema:
            type: string
            default: TODOS
            enum:
              - TODOS
              - ACTIVO
              - BORRADOR
              - INACTIVO
          description: Filtrar por el estado de la versión vigente (la `ACTIVO`; si no hay, la de mayor número)
        - in: query
          name: search
          schema:
            type: string
          description: Búsqueda textual por nombre o descripción de la plantilla
        - in: query
          name: codUnidad
          schema:
            type: integer
            example: 24
          description: Código de la unidad académica; solo la del administrador (otra responde `403`)
      responses:
        '200':
          description: Lista paginada de plantillas para el panel de administración
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                  - pagina
                  - limite
                  - totalPaginas
                  - datos
                properties:
                  total:
                    type: integer
                    example: 15
                  pagina:
                    type: integer
                    example: 1
                  limite:
                    type: integer
                    example: 10
                  totalPaginas:
                    type: integer
                    example: 2
                  datos:
                    type: array
                    items:
                      type: object
                      required:
                        - idPlantilla
                        - nombre
                        - audiencia
                        - numeroVersion
                        - estadoVersion
                        - fechaActualizacion
                      properties:
                        idPlantilla:
                          type: integer
                          example: 5
                        nombre:
                          type: string
                          example: Solicitud de Retiro de Asignatura
                        descripcion:
                          type: string
                          nullable: true
                          example: Trámite de retiro formal de materias en la FIEC
                        codUnidad:
                          type: integer
                          example: 24
                        audiencia:
                          type: array
                          items:
                            $ref: '#/components/schemas/Estamento'
                          example:
                            - ESTUDIANTE
                        numeroVersion:
                          type: integer
                          description: Número de la versión listada, la misma a la que corresponde `estadoVersion`
                          example: 2
                        estadoVersion:
                          $ref: '#/components/schemas/EstadoVersion'
                        idVersionBorrador:
                          type: integer
                          nullable: true
                          description: |
                            Versión en `BORRADOR` de la plantilla, si existe. Cuando la listada es `ACTIVO` y ya hay un
                            borrador en curso, permite abrir ese borrador en lugar de crear una versión nueva.
                          example: 14
                        fechaActualizacion:
                          type: string
                          format: date-time
                          description: |
                            Fecha de publicación de la versión; si no se ha publicado, la fecha de registro de la plantilla.
                            No refleja la última edición de un borrador: la base de datos no la guarda.
                          example: '2026-10-05T14:20:00Z'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
