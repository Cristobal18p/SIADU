      summary: Eliminar una plantilla que nunca se ha publicado
      description: |
        Elimina por completo una plantilla cuya única versión es la 1 en `BORRADOR` (nunca se publicó, así que no tiene
        solicitudes). Se borran la plantilla, esa versión y el flujo en `BORRADOR` del que la versión era dueña; los
        flujos `ACTIVO` que usaba no se tocan. La acción no se puede deshacer.
        Una plantilla que ya tuvo una versión publicada no se elimina (`409`, `CONFLICTO_ESTADO`): sus versiones
        tienen solicitudes e historial. Para retirarla del catálogo está `POST /api/templates/{id}/deactivate`.
        Una plantilla de otra unidad responde `404`.
      x-roles:
        - ADMINISTRADOR
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Identificador de la plantilla
      responses:
        '204':
          description: Plantilla eliminada
        '400':
          $ref: '#/components/responses/ValidacionFallida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
  /api/templates/{id}/versions:
    post:
      tags:
        - Templates
      operationId: createTemplateVersion
      summary: Crear nueva versión para edición (Clonado seguro)
      description: |
        Clona la versión activa actual hacia una nueva fila con estado `BORRADOR` y
        `numeroVersion = max + 1`. Esto garantiza que la versión en producción continúe
        operando sin interrupciones mientras el administrador edita los cambios.
        Si la plantilla fue desactivada y no tiene versión `ACTIVO`, se clona la de mayor `numeroVersion`, de modo
        que una plantilla desactivada se puede volver a editar y publicar.
        Responde `409` si la plantilla ya tiene una versión en `BORRADOR` (se edita esa). En ese caso, `detalles` trae
        `{ campo: "idVersion", mensaje: "<idVersion del borrador>" }` para que el cliente lo abra.
      x-roles:
        - ADMINISTRADOR
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Identificador de la plantilla
      responses:
        '201':
          description: Nueva versión borrador clonada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  idPlantilla:
                    type: integer
                    example: 5
                  idVersion:
                    type: integer
                    example: 14
                  numeroVersion:
                    type: integer
                    example: 2
                  estado:
                    type: string
                    example: BORRADOR
                  mensaje:
                    type: string
                    example: Nueva versión 2 creada para edición.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
  /api/templates/{id}/publish:
    post:
      tags:
        - Templates
      operationId: publishTemplate
      summary: Publicar versión a producción
      description: |
        Activa de forma atómica la versión indicada (`estado = ACTIVO`, `fecha_public = now()`)
        y pasa a estado `INACTIVO` cualquier versión previamente activa de la plantilla.

        **Requisito:** la versión debe tener un flujo de aprobación con al menos un paso. Sin flujo no se
        puede publicar (responde `409`), de modo que ninguna versión `ACTIVO` queda sin cadena de aprobación
        ni aparece en el catálogo de los solicitantes.

        **Flujo:** si el flujo está en `BORRADOR`, pasa a `ACTIVO` y queda reutilizable. Antes de publicar se
        vuelven a comprobar las reglas del flujo contra los titulares de hoy: cada paso debe tener un titular con
        cuenta activa y rol `APROBADOR` (`409` `APROBADOR_INVALIDO`) y ninguna persona puede estar en dos pasos
        (`409` `CONFLICTO_ESTADO`).

        **Documentos en proceso:** las solicitudes `PENDIENTE` conservan la versión y el flujo con los que fueron
        radicadas; publicar una versión nueva nunca las migra, aunque el flujo nuevo parezca una ampliación del
        anterior, y tampoco migra las de una versión desactivada. Las solicitudes `APROBADO` y `RECHAZADO` nunca
        se modifican. Solo las solicitudes radicadas después de la publicación usan la versión nueva.

        **Validaciones del documento** (`400 VALIDACION_FALLIDA`, un elemento de `detalles` por falla):
        - `cuerpoDocumento` tiene al menos un texto o una variable.
        - Cada nodo `variable` del cuerpo es una variable automática o está definido en `variableFormJson`, y
          cada variable de `variableFormJson` aparece en el cuerpo.
        - Hay a lo sumo un `signatureBlock`, y hay exactamente uno si algún paso del flujo tiene `reqFirma`.
        - Si el flujo tiene un paso `ESCUELA_SOLICITANTE`, la `audiencia` es solo `ESTUDIANTE` (solo ellos tienen carrera
          y escuela). Además, cada escuela con carreras debe tener un titular de ese cargo que pueda aprobar
          (`409` `APROBADOR_INVALIDO`).
        - Las reglas de `VariableFormJson` (ids únicos, `select` con opciones, `min` ≤ `max`, choque con `{id}Otro`).
      x-roles:
        - ADMINISTRADOR
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Identificador de la plantilla
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idVersion
              properties:
                idVersion:
                  type: integer
                  description: Identificador de la versión en borrador a publicar
                  example: 14
      responses:
        '200':
          description: Versión publicada y disponible para los solicitantes
          content:
            application/json:
              schema:
                type: object
                required:
                  - idPlantilla
                  - idVersion
                  - numeroVersion
                  - estado
                  - mensaje
                properties:
                  idPlantilla:
                    type: integer
                    example: 5
                  idVersion:
                    type: integer
                    example: 14
                  numeroVersion:
                    type: integer
                    example: 2
                  estado:
                    type: string
                    example: ACTIVO
                  mensaje:
                    type: string
                    example: La versión 2 ha sido publicada exitosamente.
        '400':
          $ref: '#/components/responses/ValidacionFallida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
