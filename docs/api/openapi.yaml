  /api/templates/{id}/deactivate:
    post:
      tags:
        - Templates
      operationId: deactivateTemplate
      summary: Desactivar la versión publicada (retirar el trámite)
      description: |
        Pasa la versión `ACTIVO` a `INACTIVO`: la plantilla deja de aparecer en el catálogo y no admite solicitudes
        nuevas (`POST /api/requests` responde `409`). Las solicitudes que ya están en proceso **no se tocan**:
        conservan su versión y su flujo, y terminan normalmente. El flujo no cambia y sigue reutilizable.

        Para volver a ofrecer el trámite se crea una versión nueva con `POST /api/templates/{id}/versions` (clona la
        última) y se publica. Responde `409` si la versión no está `ACTIVO`.
      x-roles:
        - ADMINISTRADOR
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Identificador de la plantilla
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idVersion
              properties:
                idVersion:
                  type: integer
                  description: Identificador de la versión `ACTIVO` a desactivar
                  example: 14
      responses:
        '200':
          description: Versión desactivada
          content:
            application/json:
              schema:
                type: object
                required:
                  - idPlantilla
                  - idVersion
                  - numeroVersion
                  - estado
                  - mensaje
                properties:
                  idPlantilla:
                    type: integer
                    example: 5
                  idVersion:
                    type: integer
                    example: 14
                  numeroVersion:
                    type: integer
                    example: 2
                  estado:
                    type: string
                    example: INACTIVO
                  mensaje:
                    type: string
                    example: La versión 2 fue desactivada. Las solicitudes en proceso continúan.
        '400':
          $ref: '#/components/responses/ValidacionFallida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
  /api/requests:
    post:
      tags:
        - Requests
      operationId: createRequest
      summary: Enviar formulario completado (Crear solicitud)
      description: |
        El solicitante envía las respuestas del formulario web (`datosJson`).
        El cliente envía únicamente `idVersion`: la versión identifica a la plantilla, su formulario, su diseño
        y su flujo de aprobación, y es la que se guarda en la solicitud (`solicitudes.id_version`).
        El backend valida que la versión esté `ACTIVO` y que las variables requeridas estén completas, e inicializa
        el primer paso en la tabla `aprobaciones`. Como solo se publican versiones con flujo, una versión `ACTIVO`
        siempre tiene al menos un paso.

        **Quién puede solicitar:** solo plantillas de su unidad cuya `audiencia` incluya alguno de sus estamentos; si la
        versión no existe o no le corresponde responde `404`. Una versión que le corresponde pero ya no está `ACTIVO`
        (se publicó otra o se desactivó) responde `409`. No se impide que un aprobador solicite un
        trámite en cuyo flujo participa.

        **Datos que fija el servidor:** la ruta de aprobación de la solicitud (`solicitudes.id_flujo`) es el flujo de la
        versión, y su unidad (`solicitudes.cod_unidad`) es la de la plantilla: la unidad a la que pertenece el trámite.
        Solo la ve el personal de esa unidad que pasa por el flujo. Los pasos `ESCUELA_SOLICITANTE` del flujo se resuelven al radicar: el backend toma al titular de
        ese cargo en la escuela de la carrera del solicitante y la ruta de la solicitud (`PasoDocumento`) queda con esa
        persona, de modo que cada estudiante llega al director de su escuela. Si la escuela no tiene un titular que
        pueda aprobar, responde `409` (`APROBADOR_INVALIDO`) y no se crea la solicitud.
        Si el titular del primer paso ya no puede aprobar
        (cuenta inactiva o sin rol `APROBADOR`), responde `409` (`APROBADOR_INVALIDO`) y no se crea la solicitud.
        El código documental (`UP{código de la unidad, 2 dígitos}-{año}-{número de 4 dígitos}`; el número reinicia cada año por unidad)
        lo genera la base de datos al insertar la solicitud (trigger); el cliente nunca lo envía.
        Al radicar, el backend resuelve las variables automáticas (`VariablesSistema`) con los datos del solicitante
        en ese momento y las congela en `solicitudes.datos_json` bajo la clave reservada `_sistema` (sin cambios de
        esquema). `datosJson` no puede traer claves que empiecen con `_` (`400`).
        Las claves que no son variables de la versión (ni el `{id}Otro` de un `select` con `opcionOtro`) se descartan.
        Si la versión ya no está activa (se publicó una nueva mientras el usuario llenaba el formulario),
        responde `409` para que el cliente recargue el catálogo.
        En el `400`, cada elemento de `detalles` trae en `campo` el `id` de la variable incorrecta, sin prefijos.
      x-roles:
        - SOLICITANTE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idVersion
                - datosJson
              properties:
                idVersion:
                  type: integer
                  description: Identificador de la versión activa de la plantilla que se respondió (`idVersion` del catálogo)
                  example: 12
                datosJson:
                  type: object
                  description: Mapa clave-valor con las respuestas recolectadas del formulario web
                  example:
                    codigoAsignatura: INF-204 Base de Datos I
                    motivoRetiro: LABORAL
                    justificacion: Cambio de turno en la empresa que coincide con el horario del laboratorio.
      responses:
        '201':
          description: Solicitud registrada e ingresada al flujo de aprobación
          content:
            application/json:
              schema:
                type: object
                required:
                  - idSolicitud
                  - codigoDocumento
                  - estado
                  - fechaCreacion
                  - mensaje
                properties:
                  idSolicitud:
                    type: integer
                    example: 101
                  codigoDocumento:
                    type: string
                    example: UP24-2026-0001
                  estado:
                    $ref: '#/components/schemas/EstadoSolicitud'
                  fechaCreacion:
                    type: string
                    format: date-time
                    example: '2026-10-06T13:30:00Z'
                  mensaje:
                    type: string
                    example: Su solicitud ha sido enviada con éxito al Director/a de Escuela.
        '400':
          $ref: '#/components/responses/ValidacionFallida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CambioPasswordRequerido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
  /api/requests/me:
    get:
      tags:
        - Requests
      operationId: listMyRequests
      summary: Historial de trámites del usuario autenticado
      description: |
        Lista las solicitudes enviadas por el usuario en sesión, con su estado y la fecha de resolución. Es una lista
        personal: se devuelve como arreglo plano, ordenada de la más reciente a la más antigua.
        `resolucion` solo viene en solicitudes `APROBADO` o `RECHAZADO`, con el cargo y la persona tal como quedaron al
        decidir; mientras está `PENDIENTE` vale `null`.
        El paso en curso y la ruta de aprobación se consultan en el detalle (`/api/requests/{id}`).
        Todo usuario activo tiene el rol `SOLICITANTE`, incluidos aprobadores y administradores.
      x-roles:
        - SOLICITANTE
      responses:
        '200':
          description: Listado de trámites enviados por el solicitante
          content:
