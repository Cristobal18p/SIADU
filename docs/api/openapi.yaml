                    example: Solicitud de Retiro de Asignatura
                  descripcion:
                    type: string
                    nullable: true
                    example: Trámite de retiro de asignaturas
                  codUnidad:
                    type: integer
                    example: 24
                  audiencia:
                    type: array
                    items:
                      $ref: '#/components/schemas/Estamento'
                    example:
                      - ESTUDIANTE
                  idVersion:
                    type: integer
                    example: 12
                  numeroVersion:
                    type: integer
                    example: 1
                  estado:
                    $ref: '#/components/schemas/EstadoVersion'
                  fechaPublicacion:
                    type: string
                    format: date-time
                    nullable: true
                    description: '`null` si la versión nunca se publicó'
                    example: '2026-10-05T14:20:00Z'
                  versionBorrador:
                    type: object
                    nullable: true
                    description: |
                      Solo para el administrador: versión en `BORRADOR` de la plantilla, si existe (puede ser la misma
                      consultada). `null` si no hay borrador. Para un solicitante siempre es `null`.
                    required:
                      - idVersion
                      - numeroVersion
                    properties:
                      idVersion:
                        type: integer
                        example: 14
                      numeroVersion:
                        type: integer
                        example: 2
                  variablesSistema:
                    type: object
                    nullable: true
                    description: |
                      Solo para el **solicitante** (rol SOLICITANTE): los datos automáticos que el documento usaría si
                      radicara ahora, con sus datos de perfil. Es una vista previa: el backend los vuelve a resolver
                      y congela al radicar (`POST /api/requests`). El cliente los muestra tal cual, sin calcularlos.
                      `null` para el administrador o si la versión no es publicada.
                    allOf:
                      - $ref: '#/components/schemas/VariablesSistema'
                  variableFormJson:
                    $ref: '#/components/schemas/VariableFormJson'
                  disenoFormJson:
                    $ref: '#/components/schemas/DisenoFormJson'
                  flujo:
                    type: object
                    nullable: true
                    description: |
                      Cadena de aprobación; `null` solo en borradores sin flujo asignado. Los pasos
                      `ESCUELA_SOLICITANTE` llegan sin resolver al administrador y resueltos con la escuela de la
                      carrera del usuario cuando lo pide un solicitante (así el bloque de firmas de la vista previa
                      muestra al director que de verdad firmará su trámite).
                    required:
                      - idFlujo
                      - nombre
                      - codigo
                      - estado
                      - pasos
                    properties:
                      idFlujo:
