  /api/requests/{id}:
    get:
      tags:
        - Requests
      operationId: getRequest
      summary: Detalle y línea de tiempo de una solicitud (Revisión y Seguimiento)
      description: |
        Retorna la ficha del solicitante, metadatos del trámite, respuestas del formulario y
        la línea de tiempo secuencial.
        Incluye además todo lo necesario para que el **cliente arme la vista previa** del oficio
        (`variableFormJson` y `disenoFormJson` de la versión con la que se radicó la solicitud, y la firma
        de cada paso ya aprobado). Disponible para el aprobador en cualquier paso, incluso si otros cargos ya aprobaron.
        Para la vista previa se usan `variablesSistema` (valores congelados al radicar) y `pasosDocumento` (todos los
        pasos del flujo, alcanzados o no, con `reqFirma` para armar el bloque de firmas).

        **Historial inmutable:** `pasosDocumento` y `lineaTiempo` salen de la ruta de la solicitud
        (`solicitudes.id_flujo`, que se fija al radicar y no se migra al publicar versiones nuevas). Los
        pasos ya decididos muestran el cargo, el área y la persona que había al decidir; no cambian aunque después
        cambien el cargo o su titular. Los pasos pendientes y futuros muestran los datos vigentes. Esta vista previa es
        solo de lectura: el PDF lo descarga únicamente el solicitante (`/api/documents/{requestId}/pdf`).
        Si la autoridad en sesión es la asignada en el paso actual, retorna `idAprobacionPendiente`
        para permitir resolver directamente en esta misma pantalla.


        **Quién puede abrir una solicitud:**
        - **Solicitante:** solo las que él mismo envió.
        - **Aprobador:** solo las que pasaron por su cargo en el flujo de aprobación (la que tiene pendiente y
          las que ya resolvió). El paso siguiente se crea cuando el anterior aprueba, así que no la ve antes de
          que le llegue.
        - **Administrador de plantillas:** su rol solo gestiona plantillas y no da acceso a solicitudes ajenas.
          Como todo usuario activo es también solicitante, ve únicamente las que él mismo envió.

        Quien no tenga acceso recibe `404`, igual que si la solicitud no existiera.
      x-roles:
        - SOLICITANTE
        - APROBADOR
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Identificador único de la solicitud
      responses:
        '200':
          description: Detalle completo de la solicitud y avance del flujo
          content:
            application/json:
              schema:
                type: object
                required:
                  - idSolicitud
                  - codigoDocumento
                  - idPlantilla
                  - nombrePlantilla
                  - idVersion
                  - estado
                  - fechaCreacion
                  - solicitante
                  - datosJson
                  - variablesSistema
                  - variableFormJson
                  - disenoFormJson
                  - pasosDocumento
                  - lineaTiempo
                properties:
                  idSolicitud:
                    type: integer
                    example: 101
                  codigoDocumento:
                    type: string
                    example: UP24-2026-0001
                  idPlantilla:
                    type: integer
                    example: 5
                  nombrePlantilla:
                    type: string
                    example: Solicitud de Retiro de Asignatura
                  idVersion:
                    type: integer
                    example: 12
                  estado:
                    $ref: '#/components/schemas/EstadoSolicitud'
                  fechaCreacion:
                    type: string
                    format: date-time
                    example: '2026-10-06T13:30:00Z'
                  fechaResolucion:
                    type: string
                    format: date-time
                    nullable: true
                    description: '`null` mientras esté `PENDIENTE`'
                    example: '2026-10-08T10:15:00Z'
                  idAprobacionPendiente:
                    type: integer
                    nullable: true
                    description: Presente si el usuario autenticado tiene una resolución pendiente sobre este trámite
                    example: 45
                  solicitante:
                    type: object
                    required:
                      - idUsuario
                      - nombreCompleto
                      - cedula
                      - correo
                    properties:
                      idUsuario:
                        type: integer
                        example: 8
                      nombreCompleto:
                        type: string
                        example: Alex Demo
                      cedula:
                        type: string
                        example: 9-000-0001
                      correo:
                        type: string
                        example: alex.demo@up.ac.pa
                      carrera:
                        type: string
                        nullable: true
                        description: Descripción de la carrera; `null` si el solicitante no es estudiante
                        example: Licenciatura en Ingeniería en Informática
                  datosJson:
                    type: object
                    description: Mapa clave-valor con las respuestas registradas, sin las claves reservadas (`_sistema`)
                    example:
                      codigoAsignatura: INF-204 Base de Datos I
                      motivoRetiro: LABORAL
                      justificacion: Cambio de turno en la empresa...
                  variablesSistema:
                    $ref: '#/components/schemas/VariablesSistema'
                  variableFormJson:
                    $ref: '#/components/schemas/VariableFormJson'
                  disenoFormJson:
                    $ref: '#/components/schemas/DisenoFormJson'
                  pasosDocumento:
                    type: array
                    description: Todos los pasos del flujo de la versión, ordenados por `secuencia`
                    items:
                      $ref: '#/components/schemas/PasoDocumento'
                  lineaTiempo:
                    type: array
                    description: |
                      Pasos ya alcanzados (las aprobaciones se crean a medida que avanza el flujo), ordenados por
                      `secuencia`. Los pasos futuros solo están en `pasosDocumento`.
                    items:
                      type: object
                      required:
                        - secuencia
                        - nombreCargo
                        - estado
                      properties:
                        secuencia:
                          type: integer
                          example: 1
                        nombreCargo:
                          type: string
                          example: Director/a de Escuela
                        titular:
                          type: string
                          nullable: true
                          example: Dra. Lia Muestra
                        estado:
                          $ref: '#/components/schemas/EstadoAprobacion'
                        fechaAccion:
                          type: string
                          format: date-time
                          nullable: true
                          example: '2026-10-06T15:00:00Z'
                        comentario:
                          type: string
                          nullable: true
                          example: Cumple con el reglamento académico.
                        firmaUrl:
                          type: string
                          nullable: true
                          description: 'URL firmada y temporal de la firma del titular (Storage privado); solo en pasos aprobados con `reqFirma`. Caduca: no se guarda'
                          example: https://proyecto.supabase.co/storage/v1/object/sign/firmas/12/20261015.png?token=...
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CambioPasswordRequerido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
