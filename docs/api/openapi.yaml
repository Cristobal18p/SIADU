    post:
      tags:
        - Templates
      operationId: createTemplate
      summary: Crear nueva plantilla con versión inicial (Borrador)
      description: |
        Crea la cabecera de la plantilla y su primera versión en estado `BORRADOR`.
        La transacción atómica se realiza de forma segura mediante Prisma.
        Un borrador puede guardarse incompleto: `variableFormJson` con `variables: []`, un `cuerpoDocumento`
        mínimo y sin `idFlujo`. Las exigencias del documento y del flujo se verifican al publicar.
      x-roles:
